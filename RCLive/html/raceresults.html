<!DOCTYPE html>
<!--
   Description:	Displays a simple tabbed style form to display
                the race results so far. This is then refreshed so
				that we have a live leader board.
 
   Author:		Slingshot
 
   Date: 		23rd Feb 2013
-->
<html>
  <head id ="head">
    <meta http-equiv="content-type" content="text/html;charset=utf-8" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="author" content="Slingshot" />
    <title>Race Co-ordinator Live Results</title>
 
	<link href="style/rc.css" rel="stylesheet" type="text/css" />
	<script type="text/javascript" src="scripts/soundmanager2/script/soundmanager2-nodebug-jsmin.js"></script>
<!--	
	<script type="text/javascript" src="scripts/soundmanager2/script/soundmanager2.js"></script>
-->	
	<script type="text/javascript" src="scripts/audio.js"></script>

	<script type="text/javascript" src="scripts/menu.js"></script>
	<script type="text/javascript" src="scripts/rcdata.js"></script>
	<script type="text/javascript" src="scripts/rcutils.js"></script>
 	<script type="text/javascript" src="scripts/jquery-1.9.1.min.js"></script>

  </head>
  <body onload="init();" class="anlgbody">  

  <!--Display the correct menu for this screen -->
    <div id="menu">
	<script> displayMenu(3);</script>
    </div>

	<!-- Placing a heatstaus div give us flags for current status -->
	<a id="callbutton"><img id="flags" src="images/redflag.png"/></a>

	<!-- Placing a heatinfo div give us details about the current heat -->
    <div id="heatinfo">
    </div>

	<!-- Placing a leaderBoard div will mean that it get's populated by the JS module with a
	     Leader Board table -->
    <div id="raceresults">
    </div>
   </body>
</html>
